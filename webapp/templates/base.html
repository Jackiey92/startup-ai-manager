<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SAM{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body>
<div class="app-shell"><aside class="sidebar"><a class="brand" href="{{ url_for('home_page') }}"><span class="brand-mark">S</span><span><b>Startup AI Manager</b><small>企业经营智能体</small></span></a><nav aria-label="主导航"><a class="nav-link {% if request.endpoint=='home_page' %}active{% endif %}" href="{{ url_for('home_page') }}">总览</a><a class="nav-link {% if request.endpoint=='todos_page' %}active{% endif %}" href="{{ url_for('todos_page') }}">待办中心{% if todos|default([])|length %}<span class="nav-count">{{ todos|length }}</span>{% endif %}</a><a class="nav-link {% if request.endpoint=='facts_page' %}active{% endif %}" href="{{ url_for('facts_page') }}">事实库</a><a class="nav-link {% if request.endpoint=='files_page' %}active{% endif %}" href="{{ url_for('files_page') }}">文件柜</a><a class="nav-link {% if request.endpoint=='chat_page' %}active{% endif %}" href="{{ url_for('chat_page') }}">对话</a></nav><div class="sidebar-foot">当前公司<br><b>{{ company_id }}</b></div></aside>
<main class="main"><header class="topbar"><div class="crumb">企业资料 <span>/</span> {% block crumb %}总览{% endblock %}</div><div class="top-spacer"></div><button class="button primary" type="button" data-upload-open>上传企业资料</button></header><section class="page">{% block content %}{% endblock %}</section></main></div>
<div class="modal" id="upload-modal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="upload-title"><button class="close" type="button" data-upload-close aria-label="关闭">×</button><h2 id="upload-title">上传企业资料</h2><p class="muted">文件会先真实解析、归类并固化；失败会如实显示。</p><label class="dropzone" for="upload-input"><input id="upload-input" type="file" multiple><span>选择或拖入文件</span><small>支持当前后端已配置的 PDF、Excel 等格式</small></label><div id="upload-list" class="result-list" aria-live="polite"></div></div></div>
<script>window.SAM_COMPANY_ID={{ company_id|tojson }};</script><script src="{{ url_for('static', filename='js/app.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
