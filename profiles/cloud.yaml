profile: cloud
memory:
  provider: openviking
  base_url: ""
  base_url_env: SAM_OV_BASE_URL
  api_key_env: SAM_OV_API_KEY
  ovcli_config: harness-openclaw/state/sam-ovcli.conf
  templates_dir: custom-prompts
model:
  default_model: qwen3.8-max
paths:
  project_root: /opt/sam/workspace
  harness_root: /opt/sam/workspace/harness-openclaw
  venv_bin: /opt/sam/venv/bin
  openclaw_entry: /opt/sam/workspace/.oc-runtime/node_modules/openclaw/openclaw.mjs
  state_dir: /opt/sam/workspace/harness-openclaw/state
  config_path: /opt/sam/workspace/harness-openclaw/state/openclaw.json
  data_root: /opt/sam/workspace/data
  two_a_root: /opt/sam/workspace/data/2a
  main_db: /opt/sam/workspace/data/app.db
  app_db: /opt/sam/workspace/data/sales_app/app.db
  memory_root: /opt/sam/workspace/.sam-memory
  tool_plugin_dir: /opt/sam/workspace/harness-openclaw/plugins/sam-memory
  tool_bridge_python: /opt/sam/venv/bin/python
